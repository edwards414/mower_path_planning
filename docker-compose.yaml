services:
  lawan_node:
    build:
      context: .
      dockerfile: Dockerfile
      # The deployable image (deploy/docker-compose.yaml pulls the same
      # target from GHCR); `builder` would carry the whole toolchain.
      target: runtime
    restart: unless-stopped
    stop_grace_period: 60s
    # image: ghcr.io/edwards414/mower_path_planning:main
    # image: lawan_node:latest
    command:
      - ros2
      - launch
      - mower_bringup
      - robot.launch.py
      - use_sim_time:=false
      - rosbridge_address:=${ROSBRIDGE_ADDRESS:-127.0.0.1}
      - zone_record_dir:=/home/mower/.mower/zone_record
      - sites_dir:=/home/mower/.mower/sites
      - output_root:=/home/mower/.mower/bags
      - record:=false
      # Bench setup without the u-blox receiver; with one on /dev/gps_rtk
      # set enable_gps:=true.
      - enable_gps:=false
    environment:
      # - ROS_DOMAIN_ID = 0
      - ROS_LOCALHOST_ONLY=1
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    # Live /dev + device cgroup rules, same as deploy/docker-compose.yaml
    # (udev names stay valid across re-plugs; nothing must be present at
    # start). ttyS3 = LubanCat UART3 stmcom, ttyUSB* = IMU / CP2102 stmcom,
    # ttyACM* = u-blox receiver.
    device_cgroup_rules:
      - 'c 4:67 rmw'
      - 'c 188:* rmw'
      - 'c 166:* rmw'
    volumes:
      - /dev:/dev
      - mower_data:/home/mower/.mower

  # WebRTC (WHEP) camera server. The app pulls http://<robot-ip>:8889/<feed>/whep.
  # Uses the -ffmpeg image variant so runOnDemand can encode the feeds.
  # No USB camera yet: mediamtx.yml serves one synthetic front-camera pattern.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    # When a real USB/v4l2 camera is attached, expose it to the container:
    # devices:
    #   - /dev/video0:/dev/video0

volumes:
  mower_data:
    name: mower_data
