services:
  lawan_node:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
        USER_NAME: lawan_user
    image: lawan_node:latest

    volumes:
      - ../:/car_ws

    working_dir: /car_ws

    command:
      - /bin/bash
      - -c
      - |
        source /ros_entrypoint.sh
        source install/setup.bash
        ros2 run demo_nodes_cpp talker
    environment:
      - ROS_DOMAIN_ID=10
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_LOCALHOST_ONLY=1  # 允許本地主機訪問
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    
    restart: always
    network_mode: host
    ipc: host
    pid: host
    # privileged: true # 允許容器訪問主機的資源
