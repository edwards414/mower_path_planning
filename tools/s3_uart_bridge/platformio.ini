; ESP32-S3 devkit as a transparent USB <-> UART bridge for bench testing the
; STM32 (when no plain USB-UART adapter is at hand).
;   STM32 PB6 (TX)  -> S3 GPIO17
;   STM32 PA10 (RX) <- S3 GPIO18
;   GND common; do NOT connect S3 3V3/5V to the STM32 board.
; Flash: pio run -t upload   (hold BOOT, tap RST if it fails to enter download mode)
[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBRIDGE_RX_PIN=17
  -DBRIDGE_TX_PIN=18
