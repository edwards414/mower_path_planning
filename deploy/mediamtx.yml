# MediaMTX on the mower — RTSP source restricted to the WireGuard relay.
#
# Production Flutter clients use the authenticated relay WHEP endpoint; this
# mower process does not expose WHEP directly.
#
# NO USB CAMERA YET: the front feed uses an ffmpeg synthetic test pattern so
# the complete WebRTC path can be verified end-to-end.
#
# When a real camera is attached, replace the lavfi input of the matching path,
# e.g. a USB/v4l2 camera on /dev/video0:
#   ffmpeg -f v4l2 -framerate 30 -video_size 1280x720 -i /dev/video0 \
#     -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p \
#     -profile:v baseline -level 3.1 -bf 0 -g 50 \
#     -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
# and add `devices: [/dev/video0:/dev/video0]` to the mediamtx service in
# docker-compose.yaml.

logLevel: info

webrtc: false
rtmp: false
hls: false
srt: false
moq: false

# The relay has 10.77.0.1 and the mower has 10.77.0.2 on WireGuard.
rtspAddress: 10.77.0.2:8554

authMethod: internal
authInternalUsers:
  # runOnDemand ffmpeg publishes through the mower's WireGuard address because
  # the RTSP listener is intentionally not bound to loopback/all interfaces.
  - user: any
    pass:
    ips: ["10.77.0.2"]
    permissions:
      - action: publish
        path: front
  # The public relay may read, but cannot publish or access another path.
  - user: any
    pass:
    ips: ["10.77.0.1"]
    permissions:
      - action: read
        path: front

paths:
  # Front USB camera (Global Shutter Camera, MJPG) on /dev/video0.
  front:
    # runOnDemand: ffmpeg starts only when the app (a reader) connects, and is
    # torn down shortly after the last reader leaves — same lifecycle a real
    # camera capture would want.
    runOnDemand: >
      ffmpeg -hide_banner
      -f v4l2 -input_format mjpeg -video_size 1280x720 -framerate 25 -i /dev/video0
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -profile:v baseline -level 3.1 -bf 0 -g 50
      -b:v 2000k -maxrate 2000k -bufsize 2000k
      -f rtsp rtsp://10.77.0.2:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
