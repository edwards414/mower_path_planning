# Bench / LAN camera server: WHEP on :8889 for the app, RTSP on all interfaces.
# Select with MEDIAMTX_CONFIG=mediamtx.lan.yml in .env; production uses mediamtx.yml.
#
# MediaMTX — WebRTC (WHEP) camera server for the mower app.
#
# The Flutter app pulls the single installed front camera from:
#   http://<robot-ip>:8889/front/whep
# (see `whepUrl()` in mower_lawer_app/lib/providers/mission_mock_provider.dart)
#
# The front feed is published by the host service mower-camera.service (USB
# camera -> Rockchip MPP hardware H.264), see host/mower-camera.sh.

logLevel: info

# Local development exposes only the RTSP source and WebRTC/WHEP reader.
rtmp: false
hls: false
srt: false
moq: false

# WebRTC / WHEP endpoint (HTTP signaling + media).
webrtcAddress: :8889
# UDP mux for WebRTC media (ICE host candidates). Open on the LAN via host net.
webrtcLocalUDPAddress: :8189

# Internal RTSP that the ffmpeg producers publish to; re-served over WebRTC.
rtspAddress: :8554

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: front
  - user: any
    pass:
    permissions:
      - action: read
        path: front

paths:
  # Front USB camera. The host service mower-camera.service (host/mower-camera.sh)
  # captures MJPG from /dev/video0, decodes and encodes H.264 on the Rockchip
  # VPU and publishes here over RTSP; mediamtx re-serves it over WebRTC/WHEP.
  # Without a camera, publish a test pattern from the host instead:
  #   ffmpeg -re -f lavfi -i testsrc2=size=1280x720:rate=25 -c:v libx264 \
  #     -preset ultrafast -tune zerolatency -pix_fmt yuv420p -f rtsp rtsp://localhost:8554/front
  front:
    source: publisher
