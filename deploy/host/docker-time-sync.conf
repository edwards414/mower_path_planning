# Docker's unless-stopped containers start before mower.service can gate them.
# The LubanCat has no RTC backup battery: wait for ntpd's initial clock step
# before any ROS process can integrate across the old and corrected dates.
[Unit]
Wants=network-online.target ntpsec.service
After=network-online.target ntpsec.service

[Service]
ExecStartPre=/usr/bin/python3 /opt/mower/host/mower-wait-time-sync.py
TimeoutStartSec=180
