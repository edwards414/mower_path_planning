# Kernel UDP buffers for ROS 2 DDS on the robot (ROS 2 "DDS tuning" defaults).
# The LubanCat default (rmem_max 212992) overflowed during stack start-up:
# /proc/net/snmp showed >600k UDP RcvbufErrors. Installed by deploy/install.sh.
net.core.rmem_max = 2147483647
net.core.rmem_default = 8388608
net.core.wmem_max = 2147483647
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 5000
net.ipv4.ipfrag_time = 3
net.ipv4.ipfrag_high_thresh = 134217728
