# Drop-in for ntpsec.service, installed as
# /etc/systemd/system/ntpsec.service.d/10-mower.conf by install.sh.
#
# The LubanCat's RTC has no backup battery, so every cold boot starts at the
# RTC's stale time (2025-06-26) and only ntpd can correct it. Debian's DHCP
# hook (/etc/dhcp/dhclient-exit-hooks.d/ntpsec) try-restarts ntpd on every
# lease change; at boot eth0, wwan0 and tailscale come up within seconds, which
# trips the default 5-starts-in-10-s limit. The unit then stays failed, and
# try-restart never starts a failed unit, so the clock stays wrong for the
# whole boot: the app's HMAC check (+-60 s) refuses every login, TLS to the
# backend and ghcr.io fails ("certificate not valid yet").
#
# Only the rate limit goes. Restart= stays no, as Debian ships it: restarting
# a crashed ntpd with -g would let a bad server step the clock again.
[Unit]
StartLimitIntervalSec=0
