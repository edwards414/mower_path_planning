# Robot deployment: pulls the prebuilt runtime image from GHCR (no local build).
#
# Installed on the robot by deploy/install.sh into /opt/mower together with
# the host/ systemd units. Day-to-day:
#
#   sudo systemctl status mower            # the stack (this file) on boot
#   sudo /opt/mower/host/mower-update.sh   # pull IMAGE_TAG and restart if it changed
#   sudo /opt/mower/host/mower-update.sh --tag v0.6.0   # pin / roll back
#
# The app triggers the same update through /system/update (mower_mission
# robot_info_node -> ~/.mower/host.request -> host/mower-host-request.service).
#
# Configuration lives in /opt/mower/.env (see .env.example):
#   IMAGE_TAG          release channel or version: stable (default), main, v0.6.0
#   MOWER_STATE_DIR    host dir mounted as /home/mower/.mower (zones, sites,
#                      bags, firmware_sync.json, host.request); must be owned
#                      by uid 1000 (the container user)
#   ROSBRIDGE_ADDRESS  rosbridge listen address (WireGuard/relay IP or LAN IP)
#   MOWER_FIRMWARE_SYNC=0  keep whatever firmware is on the STM32
#
# The image is the `runtime` target (linux/arm64) published to GHCR by
# .github/workflows/build.yml; it bundles the STM32 firmware from the same
# commit and flashes it at start-up (utils/firmware-sync).
services:
  lawan_node:
    image: ghcr.io/edwards414/mower_path_planning:${IMAGE_TAG:-stable}
    # Updates are explicit (host/mower-update.sh): never block a boot on a
    # registry the robot may not reach.
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - ros2
      - launch
      - mower_bringup
      - robot.launch.py
      - use_sim_time:=false
      # The public relay reaches only this WireGuard interface. Override in
      # .env if the mower's VPN address is intentionally different.
      - rosbridge_address:=${ROSBRIDGE_ADDRESS:-10.77.0.2}
      - zone_record_dir:=/home/mower/.mower/zone_record
      - sites_dir:=/home/mower/.mower/sites
      - output_root:=/home/mower/.mower/bags
      - record:=false
      # mower_rs (Rust) processes instead of their rclpy versions, one switch
      # each (src/mower_rs/README.md). Set in .env after the shadow check;
      # RUST_GUARDS only after a supervised drive.
      - rust_status:=${RUST_STATUS:-false}
      - rust_adapter:=${RUST_ADAPTER:-false}
      - rust_record:=${RUST_RECORD:-false}
      - rust_guards:=${RUST_GUARDS:-false}
      - rust_imu:=${RUST_IMU:-false}
      - rust_bridge:=${RUST_BRIDGE:-false}
    environment:
      # The graph stays on loopback (CycloneDDS config in the image); the
      # domain id only separates it from anything else on the box.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - MOWER_STATE_DIR=/home/mower/.mower
      - MOWER_FIRMWARE_SYNC=${MOWER_FIRMWARE_SYNC:-1}
      - MOWER_STM_PORT=/dev/stmcom
      - MOWER_ROBOT_ID=${MOWER_ROBOT_ID:-}
      # Fleet backend (docs/BACKEND_ARCHITECTURE.md); empty = agent idle.
      - MOWER_BACKEND_URL=${MOWER_BACKEND_URL:-}
      - MOWER_PROVISION_TOKEN=${MOWER_PROVISION_TOKEN:-}
      - MOWER_MODEL=${MOWER_MODEL:-lubancat}
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    # udev names from usb.rules (deploy/install.sh installs it):
    #   /dev/stmcom   STM32 host UART (LubanCat ttyS3 or a USB-serial adapter)
    #   /dev/imu_usb  WIT IMU (CH340)
    devices:
      - /dev/stmcom:/dev/stmcom
      - /dev/imu_usb:/dev/imu_usb
    volumes:
      - ${MOWER_STATE_DIR:-/home/cat/.mower}:/home/mower/.mower

  # u-blox RTK receiver -> /fix. Opt-in until the receiver config in gps/ is
  # validated on the robot:  docker compose --profile gps up -d
  gps:
    image: ghcr.io/edwards414/mower_path_planning-gps:${IMAGE_TAG:-stable}
    pull_policy: missing
    restart: unless-stopped
    profiles: [gps]
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/$${ROS_DISTRO}/setup.bash &&
        ros2 run ublox_gps ublox_gps_node
        --ros-args --params-file /config/ublox.yaml
        -r /ublox_gps_node/fix:=/fix
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    network_mode: host
    ipc: host
    pid: host
    devices:
      - /dev/gps_rtk:/dev/gps_rtk
    volumes:
      - ./gps/ublox.yaml:/config/ublox.yaml:ro

  # Camera server (mediamtx.yml): WHEP on :8889 for the app on the same LAN;
  # from elsewhere the app's WHEP signaling arrives through the fleet backend
  # and mower_agent, media via Cloudflare TURN (docs/BACKEND_ARCHITECTURE.md §8).
  # The front feed is published into it by the host service
  # mower-camera.service (USB camera -> Rockchip MPP H.264), so the container
  # itself needs no camera device. The -ffmpeg variant stays for test patterns.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    network_mode: host
    restart: unless-stopped
    environment:
      # Interface(s) whose addresses are offered as WebRTC ICE candidates
      # (see mediamtx.yml); comma-separated, default the wired LAN port.
      - MTX_WEBRTCIPSFROMINTERFACESLIST=${WEBRTC_INTERFACES:-eth1}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
