# Robot deployment: pulls the prebuilt runtime image from GHCR (no local build).
#
# Installed on the robot by deploy/install.sh into /opt/mower together with
# the host/ systemd units. Day-to-day:
#
#   sudo systemctl status mower            # the stack (this file) on boot
#   sudo /opt/mower/host/mower-update.sh   # pull IMAGE_TAG and restart if it changed
#   sudo /opt/mower/host/mower-update.sh --tag v0.6.0   # pin / roll back
#
# The app triggers the same update through /system/update (mower_mission
# robot_info_node -> ~/.mower/host.request -> host/mower-host-request.service).
#
# Configuration lives in /opt/mower/.env (see .env.example):
#   IMAGE_TAG          release channel or version: stable (default), main, v0.6.0
#   MOWER_STATE_DIR    host dir mounted as /home/mower/.mower (zones, sites,
#                      bags, firmware_sync.json, host.request); must be owned
#                      by uid 1000 (the container user)
#   ROSBRIDGE_ADDRESS  rosbridge listen address (WireGuard/relay IP or LAN IP)
#   MOWER_FIRMWARE_SYNC=0  keep whatever firmware is on the STM32; python /
#                      rust picks the flasher, 1 the image's default (python)
#   GPS=false          do not run the u-blox driver (no /fix; navigation
#                      stays blocked by its health gate)
#
# The image is the `runtime` target (linux/arm64) published to GHCR by
# .github/workflows/build.yml; it bundles the STM32 firmware from the same
# commit and flashes it at start-up (utils/firmware-sync).
services:
  lawan_node:
    image: ${IMAGE_REPO:-docker.io/fxrbindi/mower_path_planning}:${IMAGE_TAG:-stable}
    # Updates are explicit (host/mower-update.sh): never block a boot on a
    # registry the robot may not reach.
    pull_policy: missing
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - ros2
      - launch
      - mower_bringup
      - robot.launch.py
      - use_sim_time:=false
      # The public relay reaches only this WireGuard interface. Override in
      # .env if the mower's VPN address is intentionally different.
      - rosbridge_address:=${ROSBRIDGE_ADDRESS:-10.77.0.2}
      - zone_record_dir:=/home/mower/.mower/zone_record
      - sites_dir:=/home/mower/.mower/sites
      - output_root:=/home/mower/.mower/bags
      - record:=false
      # The recorder's robot id and R2 file, as the recorder service below
      # gets them: only RUST_RECORDER's bag module reads them here.
      - robot_id:=${MOWER_ROBOT_ID:-mower}
      - r2_env_file:=/home/mower/.mower/r2.env
      # u-blox ZED-F9P driver (mower_rs mower_gps) in this container ->
      # /fix + /gps/status; parameters in src/mower_bringup/config/gps.yaml.
      - enable_gps:=${GPS:-true}
      # Nav2 as components in one component_container_isolated process
      # (docs/ROS_FREE_PLAN.md A3). NAV_COMPOSITION=false in .env falls back
      # to one process per server without a new image.
      - nav_composition:=${NAV_COMPOSITION:-true}
      # mower_rs (Rust) processes instead of their rclpy versions, one switch
      # each (src/mower_rs/README.md). Set in .env after the shadow check;
      # RUST_GUARDS and RUST_NAV only after a supervised drive.
      - rust_status:=${RUST_STATUS:-false}
      - rust_adapter:=${RUST_ADAPTER:-false}
      - rust_record:=${RUST_RECORD:-false}
      - rust_nav:=${RUST_NAV:-false}
      - rust_battery:=${RUST_BATTERY:-false}
      - rust_pid_autotune:=${RUST_PID_AUTOTUNE:-false}
      - rust_map:=${RUST_MAP:-false}
      - rust_agent:=${RUST_AGENT:-false}
      - rust_guards:=${RUST_GUARDS:-false}
      # RUST_MUX (with RUST_DAEMON): mower_rsd's mux module instead of the
      # C++ twist_mux, on the same twist_mux_topics.yaml. It is the drive
      # path (manual priority, the navigation lock, the safety stop): the
      # first switch of a robot is a supervised run.
      - rust_mux:=${RUST_MUX:-false}
      - rust_imu:=${RUST_IMU:-false}
      - rust_bridge:=${RUST_BRIDGE:-false}
      # WS_BRIDGE_BUS: mower_ws_bridge (RUST_BRIDGE) on mower_bus instead of
      # on an r2r node of its own (docs/ROS_FREE_PLAN.md E3). It is the app's
      # only door, the in-app update included: WS_BRIDGE_BUS=false in .env is
      # the roll-back, no new image needed, and it needs SSH to the robot.
      - ws_bridge_bus:=${WS_BRIDGE_BUS:-false}
      # RUST_BASE replaces the whole ros2_control chain
      # (controller_manager + mower_hardware + diff_controller +
      # joint_state_broadcaster, ~28 % of a core) with one mower_rs
      # node; RUST_LOCALIZE the two robot_localization EKFs and
      # navsat_transform. Both default on since 2026-10-08. They drive
      # the wheels and steer nav2, so a robot still on the C++ chain is
      # switched with someone present (docs/ROS_FREE_HANDOFF.md, 上機);
      # RUST_BASE=false / RUST_LOCALIZE=false in .env is the roll-back,
      # no new image needed.
      - rust_base:=${RUST_BASE:-true}
      - rust_localize:=${RUST_LOCALIZE:-true}
      # RUST_STATIC_TF (with RUST_DAEMON): mower_rsd's static_tf module
      # instead of robot_state_publisher, on the same URDF.
      - rust_static_tf:=${RUST_STATIC_TF:-false}
      # RUST_RECORDER: mower_rsd's bag module (mower_recorder) instead of the
      # Python recorder of the recorder service below, which then sleeps.
      # Not RUST_RECORD, the zone path recorder. Off until the owner's robot
      # checks (E5-3b records the default profile; E5-5 data collection, by
      # mower-data-collection.sh's request file).
      - rust_recorder:=${RUST_RECORDER:-false}
      # RUST_DAEMON puts every module enabled above into one
      # mower_rsd process (one DDS participant); it changes no
      # behaviour. Default on; RUST_DAEMON=false runs one binary each.
      - rust_daemon:=${RUST_DAEMON:-true}
      # RUST_NAV_CORE: mower_nav steers with mower_nav_core, the in-process
      # Rust port of nav2 (docs/ROS_FREE_PLAN.md Phase D), and nav2 is not
      # started. Needs RUST_DAEMON, RUST_NAV and RUST_LOCALIZE (launch
      # refuses it otherwise). It changes the code that drives the wheels:
      # the first switch of a robot is a supervised outdoor run.
      - rust_nav_core:=${RUST_NAV_CORE:-false}
    environment:
      # The graph stays on loopback (CycloneDDS config in the image); the
      # domain id only separates it from anything else on the box.
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - MOWER_STATE_DIR=/home/mower/.mower
      - MOWER_FIRMWARE_SYNC=${MOWER_FIRMWARE_SYNC:-1}
      - MOWER_STM_PORT=/dev/stmcom
      - MOWER_ROBOT_ID=${MOWER_ROBOT_ID:-}
      # Fleet backend (docs/BACKEND_ARCHITECTURE.md); empty = agent idle.
      - MOWER_BACKEND_URL=${MOWER_BACKEND_URL:-}
      - MOWER_PROVISION_TOKEN=${MOWER_PROVISION_TOKEN:-}
      - MOWER_MODEL=${MOWER_MODEL:-lubancat}
    network_mode: host
    ipc: host
    pid: host
    stdin_open: true
    tty: true
    # Sensors come and go on USB (the hub resets, people re-plug things), so
    # the host /dev is bind-mounted instead of static `devices:` nodes: the
    # udev names from udev/99-mower.rules (/dev/stmcom, /dev/imu_usb,
    # /dev/gps_rtk) stay live inside the container and a respawned driver
    # finds a re-enumerated device whatever tty number it got. A `devices:`
    # node is a copy of one major:minor taken at create time and the
    # container has no udev, so it only worked while the kernel happened to
    # hand back the same number. Nothing has to be plugged in for the
    # container to start; a missing sensor is a respawning driver (and a
    # closed navigation health gate) until it appears. Access is limited by
    # device cgroup rules to:
    #   c 4:67    ttyS3 = /dev/stmcom, the STM32 host UART (LubanCat UART3)
    #   c 188:*   ttyUSB* = WIT IMU (CH340), or a CP2102 stmcom on a bench
    #   c 166:*   ttyACM* = u-blox ZED-F9P (CDC-ACM)
    #   c 81:*    video4linux = the front USB camera, for the bag module's
    #             camera during data collection (E5-6; mower-camera.service,
    #             which has it otherwise, is stopped for the run). The image's
    #             user is in the video group.
    device_cgroup_rules:
      - 'c 4:67 rmw'
      - 'c 188:* rmw'
      - 'c 166:* rmw'
      - 'c 81:* rmw'
    volumes:
      - /dev:/dev
      - ${MOWER_STATE_DIR:-/home/cat/.mower}:/home/mower/.mower

  # Camera server (mediamtx.yml): WHEP on :8889 for the app on the same LAN;
  # from elsewhere the app's WHEP signaling arrives through the fleet backend
  # and mower_agent, media via Cloudflare TURN (docs/BACKEND_ARCHITECTURE.md §8).
  # The front feed is published into it by the host service
  # mower-camera.service (USB camera -> Rockchip MPP H.264), so the container
  # itself needs no camera device. The -ffmpeg variant stays for test patterns.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    network_mode: host
    restart: unless-stopped
    environment:
      # Interface(s) whose addresses are offered as WebRTC ICE candidates
      # (see mediamtx.yml); comma-separated, default the wired LAN port.
      - MTX_WEBRTCIPSFROMINTERFACESLIST=${WEBRTC_INTERFACES:-eth1}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      # The `recorder` service has MediaMTX record the front stream into
      # <run>/video/ (mower_recorder video_record.py): same path as in that
      # container, so the recordPath it sends is valid here as well.
      - ${MOWER_STATE_DIR:-/home/cat/.mower}/bags:/home/mower/.mower/bags

  # Idle topic recorder behind the app's 錄話題 button: mower_recorder's
  # always-on profile (record_topics.yaml) with /mower_recorder/start|stop,
  # /status and /bags (the app's 錄製 / Bag page). autostart:=false, so
  # nothing is written until someone presses the button; while it records the
  # rear light breathes red and MediaMTX records the front camera into
  # <run>/video/ (fMP4, the H.264 stream as is, ~1 GB/h at CAMERA_BPS
  # 2000000). A run stops by itself under 2 GB free disk. lawan_node keeps record:=false, so this is the
  # only owner of /mower_recorder/* -- except during a data-collection run:
  # host/mower-data-collection.sh stops this service first and starts it
  # again afterwards. Same image as lawan_node, so mower-update.sh updates it.
  # RUST_RECORDER=true (_truthy's spellings, robot.launch.py) puts mower_rsd's
  # bag module in its place: this container then only sleeps, so that
  # /mower_recorder/* has one owner, and RUST_RECORDER=false brings it back.
  recorder:
    image: ${IMAGE_REPO:-docker.io/fxrbindi/mower_path_planning}:${IMAGE_TAG:-stable}
    pull_policy: missing
    restart: unless-stopped
    # `ros2 launch` shuts its nodes down only on SIGINT; on docker's default
    # SIGTERM a running recording would lose its unfinalized mcap.
    stop_signal: SIGINT
    stop_grace_period: 60s
    command:
      - bash
      - -c
      - 'read -r on <<< "$${RUST_RECORDER:-}"; case "$$on" in [Tt][Rr][Uu][Ee]|1|[Yy][Ee][Ss]|[Oo][Nn]) exec sleep infinity ;; esac; exec "$$@"'
      - recorder
      - ros2
      - launch
      - mower_recorder
      - record.launch.py
      - robot_id:=${MOWER_ROBOT_ID:-mower}
      - output_root:=/home/mower/.mower/bags
      - autostart:=false
      - r2_env_file:=/home/mower/.mower/r2.env
      - video_api_url:=http://127.0.0.1:9997
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-17}
      - MOWER_STATE_DIR=/home/mower/.mower
      - MOWER_ROBOT_ID=${MOWER_ROBOT_ID:-}
      # Never flash the STM32 from this container (no /dev/stmcom here).
      - MOWER_FIRMWARE_SYNC=0
      # read by the command above: true = the bag module records instead
      - RUST_RECORDER=${RUST_RECORDER:-false}
    network_mode: host
    ipc: host
    pid: host
    volumes:
      - ${MOWER_STATE_DIR:-/home/cat/.mower}:/home/mower/.mower
