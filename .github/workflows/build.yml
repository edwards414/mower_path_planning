name: Build Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'utils/**'
      - 'firmware/**'
      - 'docker-compose.yaml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'utils/**'
      - 'docker-compose.yaml'

permissions:
  contents: read
  packages: write
  id-token: write

# A new push to a PR cancels that PR's run still in progress; pushes to main
# and tags always run to the end (they publish the image robots pull).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Where the jobs run: GitHub-hosted by default, a self-hosted runner when the
# repository variable is set (Settings -> Secrets and variables -> Actions ->
# Variables), as a JSON label list, e.g.
#   IMAGE_RUNNER = ["self-hosted", "linux", "arm64"]   the arm64 image build
#   CI_RUNNER    = ["self-hosted", "linux"]            the test jobs
# Unset (or deleted) means the GitHub-hosted runner below, so a runner that is
# offline is a variable change away from the old behaviour. Setup, security
# and what each runner needs: docs/CI_RUNNERS.md.
jobs:
  python-tests:
    name: Pure Python tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    # in a container, so any Linux runner with Docker works (no setup-python
    # toolcache or sudo needed on a self-hosted machine)
    container: python:3.12-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: python -m pip install numpy opencv-python-headless pytest pyyaml websockets

      - name: Run ROS-free mower_mission tests
        working-directory: src/mower_mission
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            test/test_battery_simulator.py \
            test/test_controller_configuration.py \
            test/test_flutter_adapter_dto.py \
            test/test_image_mask_import.py \
            test/test_map_safety.py \
            test/test_nav_map_fusion.py \
            test/test_pairing.py \
            test/test_qos_configuration.py \
            test/test_robot_info.py \
            test/test_site_store.py

  coverage-core-tests:
    # The coverage planner library (safe-map filter, path validator, A*
    # connector, zigzag / spiral generators, cell decomposition). A plain Rust
    # crate linked into the mower_rs coverage node through a cargo path
    # dependency, so its unit tests need neither ROS nor r2r.
    name: mower_coverage_core tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    container: rust:1-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cargo test
        working-directory: src/mower_coverage_core
        run: cargo test --locked

  firmware:
    # STM32 application + bootloader, same Makefile the Docker `firmware`
    # stage uses. Fails in ~1 min instead of after the 1 h image build, and
    # the .bin is downloadable from the run for bench flashing.
    name: STM32 firmware
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    container: ubuntu:24.04
    steps:
      # git before checkout: without it checkout downloads a tarball and
      # `make version` (git describe) has no history
      - name: Install arm-none-eabi toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates make python3 gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build application and bootloader
        working-directory: firmware
        run: |
          make version TOOLCHAIN_BIN=
          make -j"$(nproc)" TOOLCHAIN_BIN=
          make -C bootloader TOOLCHAIN_BIN=
          cat build/mower_robot_firmware.json

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: |
            firmware/build/mower_robot_firmware.bin
            firmware/build/mower_robot_firmware.json
            firmware/build/mower_robot_firmware.elf
            firmware/bootloader/build/bootloader.bin
          if-no-files-found: error

  driver-tests:
    # mower_hardware protocol unit tests (gtest) against the real ROS distro.
    name: mower_hardware tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    container: ros:jazzy-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update || true
          rosdep install --from-paths src/mower_hardware --ignore-src -y --rosdistro jazzy

      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select mower_hardware --cmake-args -DBUILD_TESTING=ON
          colcon test --packages-select mower_hardware --event-handlers console_direct+
          colcon test-result --verbose

  build:
    name: Build ${{ matrix.name }}
    # Native arm64 (GitHub standard runner, counts against the plan's included
    # minutes like ubuntu-latest). Both images are arm64-only for the robot;
    # building them under QEMU on x86 took 82 min, native is ~10 min.
    # It is ~75 % of the workflow's billed minutes, so IMAGE_RUNNER moves it
    # to a self-hosted arm64 machine (see the top of this file).
    runs-on: ${{ fromJSON(vars.IMAGE_RUNNER || '"ubuntu-24.04-arm"') }}
    needs: [python-tests, coverage-core-tests, firmware, driver-tests]

    # Only the image something actually pulls from GHCR:
    #   runtime  deploy/docker-compose.yaml  (robot, arm64); it also carries
    #            the u-blox GPS driver, which used to be a second `-gps` image
    # The devcontainer and gazebo images are built locally by
    # .devcontainer/docker-compose.dev.yaml and were never pulled from GHCR.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            dockerfile: Dockerfile
            context: .
            target: runtime
            image_suffix: ""
            build_args: ""
            push_platforms: linux/arm64

    env:
      REPOSITORY_LC: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so git describe can name the build
          fetch-depth: 0

      - name: Set lower case repo name
        run: echo "REPOSITORY_LC=${REPOSITORY_LC,,}" >> $GITHUB_ENV

      - name: Build identity
        # Embedded in the image (MOWER_* env, /robot/info) and in the STM32
        # firmware (0x87 frame) so both report the same version.
        id: identity
        run: |
          version="$(git describe --tags --match 'v*' --always 2>/dev/null || echo dev)"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_unix=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "MOWER_VERSION=${version}" >> "$GITHUB_ENV"
          echo "build identity: ${version} ${GITHUB_SHA}"

      # GitHub-hosted only: on a self-hosted machine this would delete its
      # tools and prune every Docker image and the persistent build cache.
      - name: Free runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPOSITORY_LC }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # release channel the robots follow (deploy/docker-compose.yaml IMAGE_TAG=stable)
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Self-hosted: the long-lived `mower-ci` builder created once when the
      # runner was set up (docs/CI_RUNNERS.md), so its cache mounts (colcon
      # build tree, ccache, cargo) stay on the machine and the actions/cache
      # round trip below is skipped. GitHub-hosted: a fresh builder per job.
      - name: Set up Docker Buildx
        id: buildx
        if: runner.environment == 'github-hosted'
        uses: docker/setup-buildx-action@v3

      # Incremental workspace builds for the runtime image. Checkout gives
      # every file a fresh mtime, which would make make/rosidl rebuild the
      # whole workspace even with the build tree restored; git-restore-mtime
      # sets each file to its last commit time so only changed packages are
      # rebuilt (ccache covers the rest). The colcon build tree (incl. the
      # cargo target dir), ccache and the cargo registry live in BuildKit
      # cache mounts (see Dockerfile builder stage), which buildkit-cache-dance
      # round-trips through actions/cache.
      - name: Restore git mtimes
        if: matrix.name == 'runtime'
        run: |
          command -v git-restore-mtime >/dev/null || sudo apt-get install -y --no-install-recommends git-restore-mtime
          git restore-mtime --skip-missing
          ls -l --time-style=+%F src/mower_hardware/package.xml

      - name: Restore build caches
        if: matrix.name == 'runtime' && runner.environment == 'github-hosted'
        id: build-cache
        uses: actions/cache@v4
        with:
          path: .buildkit-cache
          key: runtime-build-cache-${{ github.sha }}
          restore-keys: |
            runtime-build-cache-

      - name: Inject build caches into BuildKit
        if: matrix.name == 'runtime' && runner.environment == 'github-hosted'
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              ".buildkit-cache/colcon-build": "/mower_ws/build",
              ".buildkit-cache/ccache": "/root/.ccache",
              ".buildkit-cache/cargo-registry": "/usr/local/cargo/registry",
              ".buildkit-cache/cargo-git": "/usr/local/cargo/git"
            }
          skip-extraction: ${{ steps.build-cache.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          builder: ${{ runner.environment == 'self-hosted' && 'mower-ci' || steps.buildx.outputs.name }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.build_args }}
            MOWER_VERSION=${{ steps.identity.outputs.version }}
            MOWER_GIT_SHA=${{ github.sha }}
            MOWER_BUILD_UNIX=${{ steps.identity.outputs.build_unix }}
            MOWER_IMAGE=ghcr.io/${{ env.REPOSITORY_LC }}${{ matrix.image_suffix }}:${{ steps.meta.outputs.version }}
          # arm64 everywhere, PRs included: the runner is arm64 so the PR
          # image loads and smoke-tests natively.
          platforms: ${{ matrix.push_platforms }}
          push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/') }}
          load: ${{ github.event_name == 'pull_request' && matrix.name == 'runtime' && !contains(github.event.pull_request.labels.*.name, 'push-image') }}
          # GitHub-hosted: the GitHub Actions layer cache (a self-hosted
          # builder keeps its own layers). Additionally publish a
          # GHCR registry cache for the runtime target (only when GHCR login has
          # run: pushes, tags, or PRs labeled push-image) so local
          # `docker buildx` builds can reuse the same builder layers via
          # --cache-from. The expression collapses to an empty line otherwise.
          cache-from: |
            ${{ runner.environment == 'github-hosted' && format('type=gha,scope={0}', matrix.name) || '' }}
            ${{ (matrix.name == 'runtime' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/'))) && format('type=registry,ref=ghcr.io/{0}-buildcache:runtime', env.REPOSITORY_LC) || '' }}
          cache-to: |
            ${{ runner.environment == 'github-hosted' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
            ${{ (matrix.name == 'runtime' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/'))) && format('type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=ghcr.io/{0}-buildcache:runtime', env.REPOSITORY_LC) || '' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select runtime image tag
        id: runtime-image
        if: github.event_name == 'pull_request' && matrix.name == 'runtime'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Smoke test runtime image
        if: github.event_name == 'pull_request' && matrix.name == 'runtime'
        run: |
          docker run --rm "${{ steps.runtime-image.outputs.tag }}" bash -lc '
            set -euo pipefail
            test -d "${WORKSPACE}/install"
            test ! -e "${WORKSPACE}/src"
            # ROS setup scripts reference unset vars; relax -u only while sourcing.
            set +u
            source /opt/ros/${ROS_DISTRO}/setup.bash
            source "${WORKSPACE}/install/setup.bash"
            set -u
            ros2 pkg prefix mower_bringup >/dev/null
            ros2 pkg prefix mower_hardware >/dev/null
            # GPS receiver driver lives in this image (mower.launch.py enable_gps)
            test -x "${WORKSPACE}/install/mower_rs/lib/mower_rs/mower_gps"
            # the only coverage planner (no rclpy version any more)
            test -x "${WORKSPACE}/install/mower_rs/lib/mower_rs/mower_coverage"
            test -s "$(ros2 pkg prefix mower_bringup)/share/mower_bringup/config/gps.yaml"
            ros2 launch mower_bringup mower.launch.py --show-args >/tmp/mower_launch_args.txt
            ros2 launch mower_bringup robot.launch.py --show-args >/tmp/robot_launch_args.txt
            # bundled STM32 firmware + sync tooling
            test -s /opt/mower/firmware/mower_robot_firmware.bin
            test -s /opt/mower/firmware/mower_robot_firmware.json
            python3 /opt/mower/firmware/mower_flash.py --help >/dev/null
            test -x /usr/local/bin/firmware-sync
            test -x /usr/local/bin/mower-host-request
            # the slimmed image (docs/IMAGE_SIZE.md) must still load everything
            ros2 launch mower_nav2 navigation.launch.py --show-args >/dev/null
            # nav2 runs composed on the robot (nav_composition, ROS_FREE_PLAN A3):
            # the container binary and every component library must survive pruning
            test -x /opt/ros/${ROS_DISTRO}/lib/rclcpp_components/component_container_isolated
            for f in /opt/ros/${ROS_DISTRO}/share/ament_index/resource_index/rclcpp_components/nav2_*; do
              lib=/opt/ros/${ROS_DISTRO}/$(cut -d";" -f2 "$f")
              test -f "$lib" || { echo "missing component library: $lib"; exit 1; }
              if ldd "$lib" | grep -q "not found"; then echo "missing shared libs: $lib"; exit 1; fi
            done
            python3 -c "import cv2, boto3, rclpy, cv_bridge, rosbridge_server, rosapi; from nav2_simple_commander.robot_navigator import BasicNavigator"
            # the removed Python planner must not ship from a stale build cache
            if python3 -c "import mower_mission.coverage_node" 2>/dev/null; then echo "stale mower_mission.coverage_node in the image"; exit 1; fi
            for b in /opt/ros/${ROS_DISTRO}/lib/{nav2_*,robot_localization,controller_manager,joy,twist_mux,topic_tools,opennav_docking,apriltag_ros}/* /opt/ros/${ROS_DISTRO}/lib/libnav2_*.so "${WORKSPACE}"/install/mower_hardware/lib/*.so "${WORKSPACE}"/install/mower_rs/lib/mower_rs/*; do
              if ldd "$b" 2>/dev/null | grep -q "not found"; then echo "missing shared libs: $b"; ldd "$b" | grep "not found"; exit 1; fi
            done
            test -n "${MOWER_VERSION}"
            echo "image ${MOWER_IMAGE} version ${MOWER_VERSION} sha ${MOWER_GIT_SHA}"
          '

      # A self-hosted daemon keeps every PR image the smoke test loaded;
      # drop this one (its layers stay in the mower-ci builder cache).
      - name: Remove the PR image from a self-hosted runner
        if: always() && runner.environment == 'self-hosted' && github.event_name == 'pull_request' && matrix.name == 'runtime' && steps.runtime-image.outputs.tag != ''
        run: docker image rm "${{ steps.runtime-image.outputs.tag }}" || true
