name: Build Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'utils/**'
      - '.devcontainer/Dockerfile'
      - '.devcontainer/Dockerfile.gazebo'
      - '.devcontainer/apt-*-packages'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - 'src/**'
      - 'utils/**'
      - '.devcontainer/Dockerfile'
      - '.devcontainer/Dockerfile.gazebo'
      - '.devcontainer/apt-*-packages'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            dockerfile: .devcontainer/Dockerfile
            context: .devcontainer
            target: dev
            image_suffix: -dev
            build_args: |
              USER_ID=1000
              GROUP_ID=1000
            push_platforms: linux/amd64,linux/arm64

          - name: runtime
            dockerfile: Dockerfile
            context: .
            target: runtime
            image_suffix: ""
            build_args: ""
            push_platforms: linux/arm64

          - name: gazebo
            dockerfile: .devcontainer/Dockerfile.gazebo
            context: .
            target: ""
            image_suffix: -gazebo
            build_args: ""
            push_platforms: linux/amd64

    env:
      REPOSITORY_LC: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lower case repo name
        run: echo "REPOSITORY_LC=${REPOSITORY_LC,,}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPOSITORY_LC }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || matrix.push_platforms }}
          push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
