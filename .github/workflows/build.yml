name: Build Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'utils/**'
      - 'firmware/**'
      - 'docker-compose.yaml'
  # A PR runs whenever it touches a file a job reads: besides the image inputs
  # above, the Python tests read deploy/ (compose, .env.example, host scripts,
  # udev rules, mediamtx.yml), the root Makefile and mediamtx.yml, and
  # docs/ROBOT_API.md. Pushes keep their own list: a deploy/-only merge would
  # otherwise publish a new :main image whose content did not change.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'utils/**'
      - 'firmware/**'
      - 'deploy/**'
      - 'docs/ROBOT_API.md'
      - 'Makefile'
      - 'mediamtx.yml'
      - 'docker-compose.yaml'

permissions:
  contents: read
  packages: write
  id-token: write

# A new push to a PR cancels that PR's run still in progress; pushes to main
# and tags always run to the end (they publish the image robots pull).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The repository is public: GitHub-hosted runners (arm64 included) cost
# nothing, and a self-hosted runner would run code from any fork's PR, so
# every job runs GitHub-hosted. A label other than push-image does not
# re-run anything (see the `if:` on each job).
jobs:
  python-tests:
    name: Pure Python tests
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every step that downloads something has a 10 min limit: a stalled
      # mirror once held a job for 23 min (run 37686141645), and the job's
      # own default limit is 6 h.
      - name: Set up Python
        timeout-minutes: 10
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        timeout-minutes: 10
        run: python -m pip install numpy opencv-python-headless pytest pyyaml websockets

      - name: Run ROS-free mower_mission tests
        working-directory: src/mower_mission
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            test/test_battery_simulator.py \
            test/test_controller_configuration.py \
            test/test_coverage_progress_tracker.py \
            test/test_flutter_adapter_dto.py \
            test/test_image_mask_import.py \
            test/test_lte_uplink.py \
            test/test_update_script.py \
            test/test_map_safety.py \
            test/test_nav_map_fusion.py \
            test/test_pairing.py \
            test/test_qos_configuration.py \
            test/test_robot_info.py \
            test/test_site_store.py \
            test/test_time_sync_gate.py

      # The rest of mower_recorder's tests need mcap / moto / boto3 (bags, R2).
      - name: Run ROS-free mower_recorder tests
        working-directory: src/mower_recorder
        run: |
          python -m pytest -q \
            test/test_camera_extrinsics.py \
            test/test_record_profile.py \
            test/test_video_record.py

  coverage-core-tests:
    # The coverage planner library (safe-map filter, path validator, A*
    # connector, boustrophedon / zigzag / spiral generators, cell
    # decomposition, navigation split mirror). A plain Rust crate linked into
    # the mower_rs coverage node through a cargo path dependency, so its tests
    # need neither ROS nor r2r.
    name: mower_coverage_core tests
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only main saves the cache (PRs restore main's): PR entries pushed the
      # repository's Actions cache over its 10 GB limit, which evicts entries
      # and brings back cold builds.
      - name: Cache cargo
        timeout-minutes: 10
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/mower_coverage_core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test
        working-directory: src/mower_coverage_core
        run: cargo test --locked

  mower-rs-tests:
    # Unit tests of every mower_rs crate (the base safety latch vectors, the
    # localisation oracle, estimator / tuning goldens, the ws bridge, the
    # coverage node's contour oracle, the daemon's module table, ...). r2r
    # generates its bindings from the sourced ROS environment, so this runs
    # in the ROS image with the message packages .cargo/config.toml lists and
    # mower_interface built first.
    name: mower_rs tests
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    container: ros:jazzy-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        # rmw_cyclonedds_cpp: the image ships only Fast DDS, and mower_bus_ros's
        # DDS tests run on the robot's RMW (they select it themselves; every
        # other test and step keeps the image's default). python3-serial:
        # firmware/tools/mower_flash.py in the flasher check.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            curl libclang-dev ros-jazzy-nav2-msgs ros-jazzy-geographic-msgs ros-jazzy-robot-localization \
            ros-jazzy-nav2-simple-commander ros-jazzy-rmw-cyclonedds-cpp python3-serial
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        timeout-minutes: 10
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/mower_rs
          # r2r generates its bindings once per build dir and never notices
          # an edited .msg/.srv/.action, so a changed interface needs a
          # fresh cache.
          key: ${{ hashFiles('src/mower_interface/msg/**', 'src/mower_interface/srv/**', 'src/mower_interface/action/**') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build mower_interface and test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select mower_interface --event-handlers console_direct-
          source install/setup.bash
          cd src/mower_rs
          cargo test --locked --workspace

      - name: Coverage node cancel tracking (black box)
        timeout-minutes: 10
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cd src/mower_rs
          cargo build --locked -p mower_coverage
          python3 tools/coverage_cancel_check.py --binary target/debug/mower_coverage

      - name: Coverage progress of both navigation servers (black box)
        timeout-minutes: 10
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cd src/mower_rs
          cargo build --locked -p mower_nav
          # each run restarts into the other server halfway, so both servers
          # run every scenario and each resumes the other's checkpoint
          export PYTHONPATH="$GITHUB_WORKSPACE/src/mower_mission:$PYTHONPATH"
          PY_NAV='python3 -m mower_mission.navigation.nav_action_server'
          python3 tools/nav_progress_check.py --restart-as "$PY_NAV" -- target/debug/mower_nav
          python3 tools/nav_progress_check.py --restart-as target/debug/mower_nav -- $PY_NAV

      - name: In-process navigation of mower_nav (black box)
        timeout-minutes: 10
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cd src/mower_rs
          cargo build --locked -p mower_nav
          # nav_backend:=nav_core, no Nav2: maps, tf and /odom from a kinematic
          # robot that follows /nav_cmd_vel; about 1.5 min (scenario C waits
          # out the tree's recoveries)
          python3 tools/nav_core_check.py -- target/debug/mower_nav

      - name: pid_autotune telemetry only during a session (black box)
        timeout-minutes: 5
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cd src/mower_rs
          cargo build --locked -p mower_pid_autotune
          python3 tools/autotune_telemetry_check.py --binary target/debug/mower_pid_autotune

      - name: Firmware flasher on a fake STM32 (black box)
        timeout-minutes: 20
        shell: bash
        # firmware/tools/mower_flash.py and its Rust port (crates/mower_flash)
        # side by side against the unmodified bootloader source (bl_protocol.c)
        # on a pty: the 57 quick scenarios (images up to 16 KB, about 6 min;
        # tools/README.md, "Checking the firmware flasher"). Every frame, the
        # flash, the report, stdout, the exit code and the time on the wire
        # compared, and both held to the scenario table and the G1 goldens
        run: |
          cd src/mower_rs
          cargo build --locked -p mower_flash
          python3 tools/flash_check.py check --impl "python=python3 ../../firmware/tools/mower_flash.py" \
            --impl rust=target/debug/mower_flash --golden ../../deploy/test/golden/firmware_sync

  firmware:
    # STM32 application + bootloader, same Makefile the Docker `firmware`
    # stage uses. Fails in ~1 min instead of after the 1 h image build, and
    # the .bin is downloadable from the run for bench flashing.
    name: STM32 firmware
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install arm-none-eabi toolchain
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Build application and bootloader
        working-directory: firmware
        run: |
          make version TOOLCHAIN_BIN=
          make -j"$(nproc)" TOOLCHAIN_BIN=
          make -C bootloader TOOLCHAIN_BIN=
          cat build/mower_robot_firmware.json

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: stm32-firmware
          path: |
            firmware/build/mower_robot_firmware.bin
            firmware/build/mower_robot_firmware.json
            firmware/build/mower_robot_firmware.elf
            firmware/bootloader/build/bootloader.bin
          if-no-files-found: error

  driver-tests:
    # mower_hardware protocol unit tests (gtest) against the real ROS distro.
    name: mower_hardware tests
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'
    container: ros:jazzy-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          apt-get update
          rosdep update || true
          rosdep install --from-paths src/mower_hardware --ignore-src -y --rosdistro jazzy

      - name: Build and test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select mower_hardware --cmake-args -DBUILD_TESTING=ON
          colcon test --packages-select mower_hardware --event-handlers console_direct+
          colcon test-result --verbose

  build:
    name: Build ${{ matrix.name }}
    # Native arm64 (GitHub standard runner, counts against the plan's included
    # minutes like ubuntu-latest). Both images are arm64-only for the robot;
    # building them under QEMU on x86 took 82 min, native is ~10 min.
    runs-on: ubuntu-24.04-arm
    # No `needs`: the image builds while the tests run. A PR only loads and
    # smoke-tests it. Everything else that publishes (main, v* tags,
    # workflow_dispatch, a PR labeled push-image) pushes it under a staging
    # tag, sha-<commit>, which nothing follows; the `publish` job moves the
    # real tags (main, stable, semver, pr-N) onto that exact manifest once
    # every test job has passed, so they still never point at an untested
    # image.
    if: github.event.action != 'labeled' || github.event.label.name == 'push-image'

    # Only the image something actually pulls from GHCR:
    #   runtime  deploy/docker-compose.yaml  (robot, arm64); it also carries
    #            the u-blox GPS driver, which used to be a second `-gps` image
    # The devcontainer and gazebo images are built locally by
    # .devcontainer/docker-compose.dev.yaml and were never pulled from GHCR.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            dockerfile: Dockerfile
            context: .
            target: runtime
            image_suffix: ""
            build_args: ""
            push_platforms: linux/arm64

    env:
      REPOSITORY_LC: ${{ github.repository }}
      # 'true' when this run publishes the image (pushes the staging tag)
      PUSH: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') }}
      # Only main writes the build caches. A PR reads main's (GitHub lets a
      # PR restore the default branch's caches); PR entries had pushed the
      # Actions cache past its 10 GB limit, which evicts main's.
      WRITE_CACHE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    # Only the digest crosses to `publish`: GitHub drops a job output that
    # holds a secret's value, and the Docker Hub tags hold the Docker Hub
    # user (run 41014490719's publish got empty tags and moved nothing).
    # publish computes the tags itself, from the same metadata.
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history so git describe can name the build
          fetch-depth: 0

      - name: Set lower case repo name
        run: echo "REPOSITORY_LC=${REPOSITORY_LC,,}" >> "$GITHUB_ENV"

      - name: Build identity
        # Embedded in the image (MOWER_* env, /robot/info) and in the STM32
        # firmware (0x87 frame) so both report the same version.
        id: identity
        run: |
          version="$(git describe --tags --match 'v*' --always 2>/dev/null || echo dev)"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_unix=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "MOWER_VERSION=${version}" >> "$GITHUB_ENV"
          echo "build identity: ${version} ${GITHUB_SHA}"

      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true
          df -h

      # Every tag goes to GHCR and, when the repository variable DOCKERHUB_REPO
      # is set (e.g. "fxrbindi/mower_path_planning"), to the same-named
      # Docker Hub repository. Robots pull from Docker Hub: from the home ISP
      # ghcr.io's CDN (Fastly) delivers ~70 kB/s while Docker Hub delivers
      # ~9 MB/s (measured 2026-10-07, deploy/README.md). Without the variable
      # the second line is empty and metadata-action ignores it.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPOSITORY_LC }}${{ matrix.image_suffix }}
            ${{ vars.DOCKERHUB_REPO != '' && format('docker.io/{0}{1}', vars.DOCKERHUB_REPO, matrix.image_suffix) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # release channel the robots follow (deploy/docker-compose.yaml IMAGE_TAG=stable)
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # What build-push pushes when publishing: the same repositories as the
      # tags above, under sha-<commit> (publish copies it to those tags).
      - name: Staging tags
        id: staging
        if: env.PUSH == 'true'
        env:
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
          IMAGE_SUFFIX: ${{ matrix.image_suffix }}
        run: |
          ghcr="ghcr.io/${REPOSITORY_LC}${IMAGE_SUFFIX}:sha-${GITHUB_SHA}"
          {
            echo "ghcr=${ghcr}"
            echo 'tags<<EOF'
            echo "${ghcr}"
            if [ -n "${DOCKERHUB_REPO}" ]; then
              echo "docker.io/${DOCKERHUB_REPO}${IMAGE_SUFFIX}:sha-${GITHUB_SHA}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub access token (Read & Write) in the DOCKERHUB_TOKEN secret;
      # the repository must exist (private) before the first push, otherwise
      # Docker Hub creates it public.
      - name: Login to Docker Hub
        if: vars.DOCKERHUB_REPO != '' && env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Incremental workspace builds for the runtime image. Checkout gives
      # every file a fresh mtime, which would make make/rosidl rebuild the
      # whole workspace even with the build tree restored; git-restore-mtime
      # sets each file to its last commit time so only changed packages are
      # rebuilt (ccache covers the rest). The colcon build tree (incl. the
      # cargo target dir), ccache and the cargo registry live in BuildKit
      # cache mounts (see Dockerfile builder stage), which buildkit-cache-dance
      # round-trips through actions/cache.
      - name: Restore git mtimes
        if: matrix.name == 'runtime'
        timeout-minutes: 10
        run: |
          sudo apt-get install -y --no-install-recommends git-restore-mtime
          git restore-mtime --skip-missing
          ls -l --time-style=+%F src/mower_hardware/package.xml

      # main restores the newest entry and saves its own; everything else only
      # restores (actions/cache/restore has no post step that saves).
      - name: Restore build caches
        if: matrix.name == 'runtime' && env.WRITE_CACHE == 'true'
        id: build-cache
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: .buildkit-cache
          key: runtime-build-cache-${{ github.sha }}
          restore-keys: |
            runtime-build-cache-

      - name: Restore build caches (read-only)
        if: matrix.name == 'runtime' && env.WRITE_CACHE != 'true'
        timeout-minutes: 10
        uses: actions/cache/restore@v4
        with:
          path: .buildkit-cache
          key: runtime-build-cache-${{ github.sha }}
          restore-keys: |
            runtime-build-cache-

      # Extraction (the post step, ~65 s) only feeds the cache save above, so
      # it is skipped whenever nothing is saved.
      - name: Inject build caches into BuildKit
        if: matrix.name == 'runtime'
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              ".buildkit-cache/colcon-build": "/mower_ws/build",
              ".buildkit-cache/ccache": "/root/.ccache",
              ".buildkit-cache/cargo-registry": "/usr/local/cargo/registry",
              ".buildkit-cache/cargo-git": "/usr/local/cargo/git"
            }
          skip-extraction: ${{ env.WRITE_CACHE != 'true' || steps.build-cache.outputs.cache-hit == 'true' }}

      - name: Build and push
        id: build
        # a cold build (no cache at all) is ~25 min; this only catches a hang
        timeout-minutes: 45
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.build_args }}
            MOWER_VERSION=${{ steps.identity.outputs.version }}
            MOWER_GIT_SHA=${{ github.sha }}
            MOWER_BUILD_UNIX=${{ steps.identity.outputs.build_unix }}
            MOWER_IMAGE=ghcr.io/${{ env.REPOSITORY_LC }}${{ matrix.image_suffix }}:${{ steps.meta.outputs.version }}
          # arm64 everywhere, PRs included: the runner is arm64 so the PR
          # image loads and smoke-tests natively.
          platforms: ${{ matrix.push_platforms }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' && matrix.name == 'runtime' }}
          # Read both caches; write them only on main. The GHCR registry cache
          # (runtime target, only once GHCR login has run) is never evicted and
          # lets local `docker buildx` builds reuse the builder layers via
          # --cache-from. An expression that does not apply collapses to an
          # empty line.
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            ${{ (matrix.name == 'runtime' && env.PUSH == 'true') && format('type=registry,ref=ghcr.io/{0}-buildcache:runtime', env.REPOSITORY_LC) || '' }}
          cache-to: |
            ${{ env.WRITE_CACHE == 'true' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
            ${{ (matrix.name == 'runtime' && env.WRITE_CACHE == 'true') && format('type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=ghcr.io/{0}-buildcache:runtime', env.REPOSITORY_LC) || '' }}
          # provenance off and one platform: a single image manifest, not an
          # index, which mower-update.sh --check compares by digest
          provenance: false
          tags: ${{ env.PUSH == 'true' && steps.staging.outputs.tags || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # A PR smoke-tests the image it loaded; a PR labeled push-image pulls
      # the staging tag it just pushed (its pr-N tag moves only in publish).
      - name: Select runtime image tag
        id: runtime-image
        if: github.event_name == 'pull_request' && matrix.name == 'runtime'
        shell: bash
        env:
          IMAGE_TAGS: ${{ env.PUSH == 'true' && steps.staging.outputs.ghcr || steps.meta.outputs.tags }}
        run: |
          tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Smoke test runtime image
        if: github.event_name == 'pull_request' && matrix.name == 'runtime'
        run: |
          docker run --rm "${{ steps.runtime-image.outputs.tag }}" bash -lc '
            set -euo pipefail
            test -d "${WORKSPACE}/install"
            test ! -e "${WORKSPACE}/src"
            # ROS setup scripts reference unset vars; relax -u only while sourcing.
            set +u
            source /opt/ros/${ROS_DISTRO}/setup.bash
            source "${WORKSPACE}/install/setup.bash"
            set -u
            ros2 pkg prefix mower_bringup >/dev/null
            ros2 pkg prefix mower_hardware >/dev/null
            # GPS receiver driver lives in this image (mower.launch.py enable_gps)
            test -x "${WORKSPACE}/install/mower_rs/lib/mower_rs/mower_gps"
            # the only coverage planner (no rclpy version any more)
            test -x "${WORKSPACE}/install/mower_rs/lib/mower_rs/mower_coverage"
            # the command-line tool, on the PATH for docker exec (crates/mowerctl)
            test -x "${WORKSPACE}/install/mower_rs/lib/mower_rs/mowerctl"
            test "$(command -v mowerctl)" = /usr/local/bin/mowerctl
            mowerctl help >/dev/null
            test -s "$(ros2 pkg prefix mower_bringup)/share/mower_bringup/config/gps.yaml"
            ros2 launch mower_bringup mower.launch.py --show-args >/tmp/mower_launch_args.txt
            ros2 launch mower_bringup robot.launch.py --show-args >/tmp/robot_launch_args.txt
            # bundled STM32 firmware + sync tooling
            test -s /opt/mower/firmware/mower_robot_firmware.bin
            test -s /opt/mower/firmware/mower_robot_firmware.json
            python3 /opt/mower/firmware/mower_flash.py --help >/dev/null
            # its Rust port, which firmware-sync does not run yet (crates/mower_flash)
            test -x "${WORKSPACE}/install/mower_rs/lib/mower_rs/mower_flash"
            test "$(command -v mower_flash)" = /usr/local/bin/mower_flash
            mower_flash --help >/dev/null
            m=/opt/mower/firmware/mower_robot_firmware.json
            # the "version sha8" in the log line of firmware-sync, as its python3 -c prints it
            test "$(mower_flash manifest "$m")" = "$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(d[\"version\"],d[\"git_sha\"][:8])" "$m")"
            test -x /usr/local/bin/firmware-sync
            test -x /usr/local/bin/mower-host-request
            # the slimmed image (docs/IMAGE_SIZE.md) must still load everything
            ros2 launch mower_nav2 navigation.launch.py --show-args >/dev/null
            # nav2 runs composed on the robot (nav_composition, ROS_FREE_PLAN A3):
            # the container binary and every component library must survive pruning
            test -x /opt/ros/${ROS_DISTRO}/lib/rclcpp_components/component_container_isolated
            for f in /opt/ros/${ROS_DISTRO}/share/ament_index/resource_index/rclcpp_components/nav2_*; do
              lib=/opt/ros/${ROS_DISTRO}/$(cut -d";" -f2 "$f")
              test -f "$lib" || { echo "missing component library: $lib"; exit 1; }
              if ldd "$lib" | grep -q "not found"; then echo "missing shared libs: $lib"; exit 1; fi
            done
            python3 -c "import cv2, boto3, rclpy, cv_bridge, rosbridge_server, rosapi; from nav2_simple_commander.robot_navigator import BasicNavigator"
            # the removed Python planner must not ship from a stale build cache
            if python3 -c "import mower_mission.coverage_node" 2>/dev/null; then echo "stale mower_mission.coverage_node in the image"; exit 1; fi
            for b in /opt/ros/${ROS_DISTRO}/lib/{nav2_*,robot_localization,controller_manager,joy,twist_mux,topic_tools,opennav_docking,apriltag_ros}/* /opt/ros/${ROS_DISTRO}/lib/libnav2_*.so "${WORKSPACE}"/install/mower_hardware/lib/*.so "${WORKSPACE}"/install/mower_rs/lib/mower_rs/*; do
              if ldd "$b" 2>/dev/null | grep -q "not found"; then echo "missing shared libs: $b"; ldd "$b" | grep "not found"; exit 1; fi
            done
            test -n "${MOWER_VERSION}"
            echo "image ${MOWER_IMAGE} version ${MOWER_VERSION} sha ${MOWER_GIT_SHA}"
          '

  publish:
    # Moves the tags robots and people follow (main, stable, semver, pr-N)
    # onto the manifest `build` pushed as sha-<commit>, once every test job
    # has passed: the same gate the push had before `build` stopped waiting
    # for the tests. imagetools copies that manifest byte for byte
    # (--prefer-index=false; its default wraps a single manifest in an
    # index), so the digest a robot compares (mower-update.sh --check,
    # /robot/info) is the one build-push produced. The dry run is checked
    # first, every tag again afterwards.
    name: Publish runtime tags
    runs-on: ubuntu-latest
    needs: [python-tests, coverage-core-tests, mower-rs-tests, firmware, driver-tests, build]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image')
    env:
      REPOSITORY_LC: ${{ github.repository }}
    steps:
      - name: Set lower case repo name
        run: echo "REPOSITORY_LC=${REPOSITORY_LC,,}" >> "$GITHUB_ENV"

      # The same metadata as build's "Docker meta" (keep the two in step);
      # computed here because the tags cannot come as build's output.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPOSITORY_LC }}
            ${{ vars.DOCKERHUB_REPO != '' && format('docker.io/{0}', vars.DOCKERHUB_REPO) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # release channel the robots follow (deploy/docker-compose.yaml IMAGE_TAG=stable)
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_REPO != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Point the tags at the tested manifest
        timeout-minutes: 10
        shell: bash
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest from build: '$DIGEST'"; exit 1; }
          # nothing to move is a failure, not a quiet success
          [[ -n "${TAGS//[[:space:]]/}" ]] || { echo "no tags to publish"; exit 1; }
          # $1 = file holding one manifest (an optional trailing newline is
          # dropped): exit 1 unless it is $DIGEST and a single image manifest
          check_manifest() {
            python3 - "$DIGEST" "$1" <<'PY'
          import hashlib, json, sys
          want, path = sys.argv[1], sys.argv[2]
          raw = open(path, 'rb').read()
          if raw.endswith(b'\n'):
              raw = raw[:-1]
          got = 'sha256:' + hashlib.sha256(raw).hexdigest()
          kind = json.loads(raw).get('mediaType')
          ok = got == want and kind in ('application/vnd.oci.image.manifest.v1+json',
                                        'application/vnd.docker.distribution.manifest.v2+json')
          print(f'{path}: {kind} {got}' + ('' if ok else f' -- expected the single image manifest {want}'))
          sys.exit(0 if ok else 1)
          PY
          }
          # one call per repository, from that repository's own copy (the
          # staging push put the blobs there)
          for repo in $(printf '%s\n' "$TAGS" | sed -n 's/:[^:/]*$//p' | sort -u); do
            repo_tags=() args=()
            while IFS= read -r tag; do
              repo_tags+=("$tag") args+=(-t "$tag")
            done < <(printf '%s\n' "$TAGS" | awk -v r="${repo}:" 'index($0, r) == 1')
            docker buildx imagetools create --dry-run --prefer-index=false "${args[@]}" "${repo}@${DIGEST}" > dry-run.json
            check_manifest dry-run.json
            docker buildx imagetools create --prefer-index=false "${args[@]}" "${repo}@${DIGEST}"
            for tag in "${repo_tags[@]}"; do
              docker buildx imagetools inspect --raw "$tag" > published.json
              check_manifest published.json
              echo "$tag -> $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done
