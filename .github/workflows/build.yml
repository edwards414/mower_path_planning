name: Build Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'utils/**'
      - 'docker-compose.yaml'
      - '.devcontainer/Dockerfile'
      - '.devcontainer/Dockerfile.gazebo'
      - '.devcontainer/apt-*-packages'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'utils/**'
      - 'docker-compose.yaml'
      - '.devcontainer/Dockerfile'
      - '.devcontainer/Dockerfile.gazebo'
      - '.devcontainer/apt-*-packages'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dev
            dockerfile: .devcontainer/Dockerfile
            context: .devcontainer
            target: dev
            image_suffix: -dev
            build_args: |
              USER_ID=1000
              GROUP_ID=1000
            push_platforms: linux/amd64,linux/arm64

          - name: runtime
            dockerfile: Dockerfile
            context: .
            target: runtime
            image_suffix: ""
            build_args: ""
            push_platforms: linux/arm64

          - name: gazebo
            dockerfile: .devcontainer/Dockerfile.gazebo
            context: .
            target: ""
            image_suffix: -gazebo
            build_args: ""
            push_platforms: linux/amd64

    env:
      REPOSITORY_LC: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lower case repo name
        run: echo "REPOSITORY_LC=${REPOSITORY_LC,,}" >> $GITHUB_ENV

      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPOSITORY_LC }}${{ matrix.image_suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Login to GHCR
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: github.event_name != 'pull_request' || matrix.name == 'runtime'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || matrix.push_platforms }}
          push: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/') }}
          load: ${{ github.event_name == 'pull_request' && matrix.name == 'runtime' && !contains(github.event.pull_request.labels.*.name, 'push-image') }}
          # Always keep the fast GitHub Actions cache. Additionally publish a
          # GHCR registry cache for the runtime target (only when GHCR login has
          # run: pushes, tags, or PRs labeled push-image) so local
          # `docker buildx` builds can reuse the same builder layers via
          # --cache-from. The expression collapses to an empty line otherwise.
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            ${{ (matrix.name == 'runtime' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/'))) && format('type=registry,ref=ghcr.io/{0}-buildcache:runtime', env.REPOSITORY_LC) || '' }}
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.name }}
            ${{ (matrix.name == 'runtime' && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'push-image') || startsWith(github.ref, 'refs/tags/'))) && format('type=registry,mode=max,image-manifest=true,oci-mediatypes=true,ref=ghcr.io/{0}-buildcache:runtime', env.REPOSITORY_LC) || '' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Select runtime image tag
        id: runtime-image
        if: github.event_name == 'pull_request' && matrix.name == 'runtime'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Smoke test runtime image
        if: github.event_name == 'pull_request' && matrix.name == 'runtime'
        run: |
          docker run --rm "${{ steps.runtime-image.outputs.tag }}" bash -lc '
            set -euo pipefail
            test -d "${WORKSPACE}/install"
            test ! -e "${WORKSPACE}/src"
            # ROS setup scripts reference unset vars; relax -u only while sourcing.
            set +u
            source /opt/ros/${ROS_DISTRO}/setup.bash
            source "${WORKSPACE}/install/setup.bash"
            set -u
            ros2 pkg prefix mower_bringup >/dev/null
            ros2 launch mower_bringup mower.launch.py --show-args >/tmp/mower_launch_args.txt
          '

      - name: Build runtime ARM64 release target
        if: github.event_name == 'pull_request' && matrix.name == 'runtime'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/arm64
          push: false
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            type=gha,scope=${{ matrix.name }}-arm64-pr
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64-pr
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
