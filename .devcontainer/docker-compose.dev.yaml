networks:
  rosnet:
    name: rosnet
    driver: bridge

services:
  lawan_node_dev:
    # name of this service, will be used in devcontainer.json
    image: lawan_node_dev # thw image will have this name once built
    extends:
      file: docker-compose.cv.yaml # extend the below service from this file
      service: lawan_node_cv
    build:
      context: .
      dockerfile: Dockerfile # the only dockerfile
      args:
        USER_NAME: $USER_NAME # will be taken from .env file, run export_env.sh first
        USER_ID: $USER_ID
        GROUP_NAME: $GROUP_NAME
        GROUP_ID: $GROUP_ID
      target: dev # must match the stage name in Dockerfile
    user: $USER_NAME # will login as your usename
    environment:
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOG_DIR: /tmp/ros-logs
    networks:
      - rosnet
    ports:
      - "9090:9090" # rosbridge_websocket — Flutter app integration
    # devices:
    #   - /dev/imu_usb:/dev/imu_usb
    #   - /dev/stmcom:/dev/stmcom # Interactive shell
    stdin_open: true
    tty: true
    volumes:
      - ../:/home/$USER_NAME/mower_ws # mount workspace directory inside the container

  # Gazebo Simulation Environment with VNC
  gazebo:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.gazebo
    init: true
    networks:
      - rosnet
    environment:
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOG_DIR: /tmp/ros-logs
      QT_X11_NO_MITSHM: "1"
      __GL_SYNC_TO_VBLANK: "0"
      vblank_mode: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      GZ_FUEL_CACHE_PATH: /home/ubuntu/.gz/fuel
    security_opt:
      - seccomp=unconfined
    ipc: host
    working_dir: /home/$USER_NAME/mower_ws
    ports:
      - "6080:80" # noVNC web interface
    volumes:
      - ../:/home/$USER_NAME/mower_ws:cached
      - ../.cache/gz/fuel:/home/ubuntu/.gz/fuel
    privileged: true # Gazebo 可能需要硬體加速
    shm_size: '12gb' # 增加共享記憶體以提升 Gazebo 效能
    tmpfs:
      - /tmp:size=1g,mode=1777
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
