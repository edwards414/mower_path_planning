# MediaMTX — WebRTC (WHEP) camera server for the mower app.
#
# The Flutter app pulls the single installed front camera from:
#   http://<robot-ip>:8889/front/whep
# (see `whepUrl()` in mower_lawer_app/lib/providers/mission_mock_provider.dart)
#
# NO USB CAMERA YET: the front feed uses an ffmpeg synthetic test pattern so
# the complete WebRTC path can be verified end-to-end.
#
# When a real camera is attached, replace the lavfi input of the matching path,
# e.g. a USB/v4l2 camera on /dev/video0:
#   ffmpeg -f v4l2 -framerate 30 -video_size 1280x720 -i /dev/video0 \
#     -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p \
#     -profile:v baseline -level 3.1 -bf 0 -g 50 \
#     -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
# and add `devices: [/dev/video0:/dev/video0]` to the mediamtx service in
# docker-compose.yaml.

logLevel: info

# Local development exposes only the RTSP source and WebRTC/WHEP reader.
rtmp: false
hls: false
srt: false
moq: false

# WebRTC / WHEP endpoint (HTTP signaling + media).
webrtcAddress: :8889
# UDP mux for WebRTC media (ICE host candidates). Open on the LAN via host net.
webrtcLocalUDPAddress: :8189

# Internal RTSP that the ffmpeg producers publish to; re-served over WebRTC.
rtspAddress: :8554

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: front
  - user: any
    pass:
    permissions:
      - action: read
        path: front

paths:
  # Synthetic front camera — animated test pattern.
  front:
    # runOnDemand: ffmpeg starts only when the app (a reader) connects, and is
    # torn down shortly after the last reader leaves — same lifecycle a real
    # camera capture would want.
    runOnDemand: >
      ffmpeg -hide_banner -re
      -f lavfi -i testsrc2=size=1280x720:rate=25
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -profile:v baseline -level 3.1 -bf 0 -g 50
      -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnDemandRestart: yes
    runOnDemandCloseAfter: 10s
