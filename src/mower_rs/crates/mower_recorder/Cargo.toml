[package]
name = "mower_recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "mower_recorder's three nodes (recorder_manager, bag_store, graph_snapshot) as mower_rsd's module bag, behind rust_recorder (docs/ROS_FREE_PLAN.md step E5; E5-3a: idle, no recording yet)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mower_recorder"
path = "src/main.rs"

[dependencies]
futures.workspace = true
# the bus bridge's node names, which the one-owner check leaves out, and the
# standalone runner
mower_bridge = { path = "../mower_bridge" }
mower_bus = { path = "../mower_bus" }
mower_pyfmt = { path = "../mower_pyfmt" }
mower_recorder_core = { path = "../mower_recorder_core" }
mower_rs_common = { path = "../mower_rs_common" }
r2r.workspace = true
tokio.workspace = true

[dev-dependencies]
# tests/module.rs: the rear light as mower_base reads it
mower_base = { path = "../mower_base" }
# tests/r2r_patch3.rs: the type hashes rosbag2 wrote (E5-1's table)
mower_schema = { path = "../mower_schema" }
