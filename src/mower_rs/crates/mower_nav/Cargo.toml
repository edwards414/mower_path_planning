[package]
name = "mower_nav"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Navigation action server: coverage execution through Nav2 with the dispatch / cancel / health / mutation-lock protocol (port of mower_mission/navigation/nav_action_server.py)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mower_nav"
path = "src/main.rs"

[dependencies]
mower_bridge = { path = "../mower_bridge" }
mower_rs_common = { path = "../mower_rs_common" }
mower_bus = { path = "../mower_bus" }
mower_nav_core = { path = "../mower_nav_core" }
# nav_core.pose_source: tfbus reads the robot pose from mower_localize's
# in-process transform cache (core_backend).
mower_localize = { path = "../mower_localize" }
mower_localize_core = { path = "../mower_localize_core" }
r2r.workspace = true
futures.workspace = true
tokio.workspace = true
serde_json.workspace = true
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# tests/bus.rs runs coverage against nav on one bus: the one action pair in
# the process.
mower_coverage = { path = "../mower_coverage" }
