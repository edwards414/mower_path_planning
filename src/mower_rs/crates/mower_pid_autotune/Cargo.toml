[package]
name = "mower_pid_autotune"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wheel-speed PID auto-tune for the STM32 base: FOPDT identification + SIMC PI, verified closed loop, operator apply/discard (port of mower_mission/pid_autotune_node.py + pid_tuning.py)"

[[bin]]
name = "mower_pid_autotune"
