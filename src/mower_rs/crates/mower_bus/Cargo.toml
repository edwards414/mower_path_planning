[package]
name = "mower_bus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-process typed publish/subscribe, services, type-erased JSON access and a drivable clock for the modules of one process (docs/ROS_FREE_PLAN.md step E1, see README.md)"

# No r2r, no ROS: builds and tests with a plain `cargo test` on any host. The
# DDS side of the process lives in mower_bus_ros.
[dependencies]
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
# sync primitives for wake-ups, time for Clock::system's async sleeps
tokio.workspace = true

[dev-dependencies]
# test-util: tokio's paused time is the oracle for Interval's missed-tick rules.
tokio = { workspace = true, features = ["test-util"] }
