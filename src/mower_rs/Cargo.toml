[workspace]
resolver = "2"
# vendor/r2r is a patched dependency (see [patch.crates-io]), not a member.
exclude = ["vendor"]
members = ["crates/mower_rs_common", "crates/robot_status", "crates/velocity_command_guard", "crates/mower_adapter", "crates/mower_imu", "crates/mower_ws_bridge", "crates/mower_record", "crates/mower_nav", "crates/mower_battery", "crates/mower_pid_autotune", "crates/mower_map", "crates/mower_coverage", "crates/mower_agent", "crates/mower_ubx", "crates/mower_gps", "crates/mower_base_core", "crates/mower_base", "crates/mower_localize_core", "crates/mower_nav_core", "crates/mower_rsd", "crates/mower_localize", "crates/mower_bus"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
r2r = "0.9.7"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[profile.release]
opt-level = 2
debug = false
strip = true

# r2r 0.9.7 with one patch: spin_once keeps its rcl wait set between calls
# instead of creating and destroying it every time (vendor/r2r/VENDORED.md).
[patch.crates-io]
r2r = { path = "vendor/r2r" }
