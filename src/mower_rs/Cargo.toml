[workspace]
resolver = "2"
members = ["crates/mower_rs_common", "crates/robot_status"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
r2r = "0.9.7"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"

[profile.release]
opt-level = 2
debug = false
strip = true
