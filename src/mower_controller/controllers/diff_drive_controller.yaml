controller_manager:
  ros__parameters:
    # 25 Hz: the STM32 status frame (0x85) comes every 50 ms and the command
    # timeout is 300 ms, so 25 Hz reads every frame and still refreshes the
    # command 7 times per timeout; 50 Hz cost ~29 % of a core for nothing.
    update_rate: 25  # Hz

    diff_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_controller:
  ros__parameters:
    publish_rate: 25.0
    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheels_per_side: 1
    wheel_separation: 0.35
    # The wheel STL is 0.18144 m in diameter; use its nominal 0.09 m radius.
    # Keep this aligned with mower_description/config/controllers.yaml.
    wheel_radius: 0.09
    # base_link is the CAD frame and is rotated 90 degrees from the mower's
    # forward axis. Nav2 and both EKFs use base_footprint as the robot frame.
    base_frame_id: base_footprint
    odom_frame_id: odom

    use_stamped_vel: true
    # velocity_command_guard rewrites every accepted/stop command stamp with
    # robot ROS time; phone/replay clocks are never forwarded to the controller.
    # Stop if twist_mux stops producing fresh commands (for example when the
    # navigation coordinator dies and its fail-safe lock expires).
    cmd_vel_timeout: 0.25
    enable_odom_tf: false

    open_loop: true

    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 1.0
    linear.x.max_acceleration_reverse: -1.0
    # A safety zero must not spend another ~0.5 s in the controller limiter.
    # At 25 Hz these bounds can remove the full configured speed in one cycle.
    linear.x.max_deceleration: -25.0
    linear.x.max_deceleration_reverse: 25.0

    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 2.0
    angular.z.max_acceleration_reverse: -2.0
    angular.z.max_deceleration: -50.0
    angular.z.max_deceleration_reverse: 50.0

joint_state_broadcaster:
  ros__parameters: {}
