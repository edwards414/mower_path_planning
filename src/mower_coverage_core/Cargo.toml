[package]
name = "mower_coverage_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Coverage path planning core for the autonomous lawn mower: safe-map filter, path validator, A* connector, zigzag / spiral generators and boustrophedon cell decomposition. Linked into the mower_rs coverage node."
publish = false

[lib]
name = "mower_coverage_core"
crate-type = ["rlib"]

[dependencies]
ndarray = "0.15"
ordered-float = "4"

[dev-dependencies]
# Only for reading tests/data/python_reference_oracle.json; float_roundtrip
# parses every recorded float to the exact f64 the Python reference used.
serde_json = { version = "1", features = ["float_roundtrip"] }
