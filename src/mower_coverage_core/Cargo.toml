[package]
name = "mower_coverage_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Coverage path planning core for autonomous lawn mower (PyO3 extension)"

[lib]
name = "mower_coverage_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
# The PyO3 module for the Python coverage backend; off when the crate is
# linked into the mower_rs coverage node.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }
numpy = { version = "0.21", optional = true }
ndarray = "0.15"
ordered-float = "4"

[dev-dependencies]
approx = "0.5"
