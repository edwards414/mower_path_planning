# GPS WPF CHANGES:
# - amcl params where removed. They are not needed because global localization is provided
#   by an ekf node on robot_localization fusing gps data with local odometry sources
# - static layer is removed from both costmaps, in this tutorial we assume there is no map
#   of the environment
# - global costmap is set to be rolling to allow the robot to traverse big environment by
#   following successive relatively close waypoints that fit in a smaller rolling costmap

bt_navigator:
  ros__parameters:
    bond_heartbeat_period: 0.0   # no /bond mesh, see lifecycle_manager bond_timeout
    global_frame: map
    robot_base_frame: base_footprint
    odom_frame: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    bond_heartbeat_period: 0.0   # no /bond mesh, see lifecycle_manager bond_timeout
    enable_stamped_cmd_vel: true   # Nav2 Jazzy 預設使用 TwistStamped
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    # Costmap 更新超時容忍：預設 0.3s 太短，提高避免 timeout error
    costmap_update_timeout: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      #RotationShimController
      # Coverage paths contain tight turns near boundaries; rotate earlier so
      # RPP does not try to cut those turns with a forward collision arc.
      angular_dist_threshold: 0.6
      forward_sampling_distance: 0.25
      angular_disengage_threshold: 0.35
      rotate_to_heading_angular_vel: 0.6
      max_angular_accel: 1.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      #RPP
      desired_linear_vel: 0.26   # match velocity_smoother max_velocity [0.26]; was 0.2 (~23% of straight-row throughput unused)
      lookahead_dist: 0.25
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.35
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.08
      use_rotate_to_heading: false
      allow_reversing: false
      rotate_to_heading_min_angle: 1.57
      max_robot_pose_search_dist: 10.0
      min_distance_to_obstacle: 0.0
      stateful: true
# WARNING: No scan/live-obstacle layer is configured here. Both costmaps only
# consume static, fail-closed maps produced by map_manage.
local_costmap:
  local_costmap:
    ros__parameters:
      # A4 (docs/ROS_FREE_PLAN.md): the only layer here is a static map that
      # changes when a zone is (re)loaded, so 5 Hz bought nothing but CPU.
      # 2 Hz still refreshes the rolling window well inside the controller's
      # 0.5 m/s worst case; publish 1 Hz is for the app/rviz only.
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.5
      plugins:
      - static_layer
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map_grid"
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.5
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: "/map_grid_global"
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    bond_heartbeat_period: 0.0   # no /bond mesh, see lifecycle_manager bond_timeout
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Coverage goals must never be silently substituted by a nearby free
      # cell; the safety-inflated mission boundary is the exact contract.
      tolerance: 0.0
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    bond_heartbeat_period: 0.0   # no /bond mesh, see lifecycle_manager bond_timeout
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True


behavior_server:
  ros__parameters:
    bond_heartbeat_period: 0.0   # no /bond mesh, see lifecycle_manager bond_timeout
    enable_stamped_cmd_vel: true   # 與 controller_server 保持一致
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    bond_heartbeat_period: 0.0   # no /bond mesh, see lifecycle_manager bond_timeout
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    bond_heartbeat_period: 0.0   # no /bond mesh, see lifecycle_manager bond_timeout
    odom_topic: "/odometry/global"
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Preserve controller_server's original stamp while smoothing/replaying;
    # the final velocity guard uses it to reject stale Nav2 output.
    stamp_smoothed_velocity_with_smoothing_time: false
    max_velocity: [0.26, 0.0, 1.0]
    min_velocity: [-0.26, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true   # 使用 TwistStamped，與 diff_drive_controller use_stamped_vel: true 對應

docking_server:
  ros__parameters:
    controller_frequency: 30.0
    initial_perception_timeout: 3.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 25.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    rotation_angular_tolerance: 0.10
    max_retries: 2
    base_frame: "base_footprint"
    fixed_frame: "odom"
    odom_topic: "/odometry/global"
    odom_duration: 0.3
    dock_prestaging_tolerance: 0.5
    introspection_mode: "disabled"

    dock_plugins: ["mower_reverse_dock"]
    mower_reverse_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.08
      staging_x_offset: -0.8
      use_external_detection_pose: true
      detector_service_name: ""
      detector_service_timeout: 5.0
      subscribe_toggle: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.20
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
      use_battery_status: false
      use_stall_detection: false
      dock_direction: "backward"
      rotate_to_dock: false

    docks: ["home_dock"]
    home_dock:
      type: "mower_reverse_dock"
      frame: "map"
      pose: [0.0, 0.0, 0.0]
      id: "home_dock"

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.04
      v_linear_max: 0.12
      v_angular_max: 0.45
      slowdown_radius: 0.35
      deceleration_max: 1.0
      rotate_to_heading_angular_vel: 0.45
      rotate_to_heading_max_angular_accel: 1.2
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 1.0
      simulation_time_step: 0.1
      dock_collision_threshold: 0.3


