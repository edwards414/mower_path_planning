[package]
name = "mower-fw"
version = "0.1.0"
edition = "2021"

[dependencies]
mower-core = { path = "../mower-core" }

embassy-stm32 = { version = "0.6", features = ["stm32f411ce", "time-driver-tim9", "exti", "unstable-pac"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
embassy-sync = "0.8"
embassy-futures = "0.1"

cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
static_cell = "2"
heapless = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }

[[bin]]
name = "mower-fw"
test = false
bench = false
